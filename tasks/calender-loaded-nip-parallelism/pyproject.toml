[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robocurve-calender-nip"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "yam-arena==0.1.0"]
description = "Native full-size laboratory calender loaded-nip commissioning."

[project.entry-points."inspect_robots.embodiments"]
calender_nip = "calender_nip.adapter:calender_nip"

[project.entry-points."inspect_robots.policies"]
calender_demo = "calender_nip.policy:calender_demo"
calender_llm = "calender_nip.policy:calender_llm"

[tool.setuptools.packages.find]
include = ["calender_nip*"]

[tool.setuptools.package-data]
calender_nip = ["*.usda"]
